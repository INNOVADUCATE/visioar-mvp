<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VisioAR — Menú 3D + AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Montserrat (opcional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>
  <div class="wrap">

    <header class="topbar">
      <div class="brand">
        <div class="brand__logo" title="Logo">
          <img src="assets/logo.png" alt="Logo"
               onerror="this.style.display='none'; this.parentElement.textContent='🍽️';" />
        </div>
        <div class="brand__text">
          <b id="restName">Restaurante Demo</b>
          <span>VisioAR • Menú 3D + AR</span>
        </div>
      </div>

      <div class="top-controls">
        <select id="dishSelect" title="Elegir plato">
          <option value="">Cargando…</option>
        </select>

        <button id="toggleCardBtn" class="primary" title="Ficha del plato">Ficha</button>
      </div>
    </header>

    <section class="hero">
      <h1 id="dishName">Hamburguesa Rica Rica</h1>
      <div class="price" id="dishPrice">$25.900</div>
      <p class="sub" id="dishDesc">
        Colocá el plato en tu mesa/piso con AR. Luego activá la ficha para ver ingredientes y peso.
      </p>
    </section>

    <section class="viewerShell">
      <model-viewer
        id="mv"
        src="./models/demo/hamburguesa.glb"
        ar
        ar-modes="scene-viewer webxr quick-look"
        ar-placement="floor"
        ar-scale="fixed"
        scale="1 1 1"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        camera-orbit="0deg 75deg 1.3m"
        field-of-view="30deg"
        alt="Plato en 3D">

        <button slot="ar-button" class="arBtn">👀 Ver en mi espacio</button>
      </model-viewer>
    </section>


    <div class="actions">
      <div class="left">
        <button id="prevBtn">← Anterior</button>
        <button id="nextBtn">Siguiente →</button>
      </div>
      <div class="pill">Tip: en AR, buscá buena luz</div>
    </div>

    <div class="errorBox" id="errorBox"></div>

    <section class="panel">
      <div class="panel__head">
        <div>
          <b style="color:#fff">Ficha generada</b>
          <span style="margin-left:6px">(preview)</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="fontSelect" title="Tipografía ficha">
            <option value="calibri">Calibri</option>
            <option value="montserrat">Montserrat</option>
          </select>
          <button id="togglePreviewBtn" title="Mostrar/ocultar preview">Ver</button>
        </div>
      </div>
      <div class="panel__body" id="panelBody">
        <img id="previewImg" class="previewImg" alt="Preview ficha" />
      </div>
    </section>

  </div>

  <script type="module">
    import { renderItem, updatePreview } from "./src/ui/render.js";
    // -----------------------------
    // Datos del menú (desde menu.json)
    // -----------------------------
    let MENU = [];

    // UI refs
    const mv = document.getElementById("mv");
    const restName = document.getElementById("restName");
    const dishSelect = document.getElementById("dishSelect");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const fontSelect = document.getElementById("fontSelect");
    const toggleCardBtn = document.getElementById("toggleCardBtn");

    const togglePreviewBtn = document.getElementById("togglePreviewBtn");
    const panelBody = document.getElementById("panelBody");

    const errorBox = document.getElementById("errorBox");

    // Estado
    let index = 0;
    let showCard = false;

    function bySlug(slug){
      const i = MENU.findIndex(x => x.slug === slug);
      return i >= 0 ? i : 0;
    }

    function setError(msg){
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }
    function clearError(){
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function refreshPreview(){
      const item = MENU[index];
      const tex = generateInfoCardTexture(item, fontSelect.value);
      updatePreview(tex);
    }

    // -----------------------------
    // Render plato
    // -----------------------------
    function setModel(modelPath){
      mv.src = modelPath;
    }

    function render(){
      const item = MENU[index];
      renderItem(item);

      clearError();

      // Set model (forzamos recarga limpia)
      setModel(item.glb);

      refreshPreview();
    }

    // -----------------------------
    // Eventos
    // -----------------------------
    dishSelect.addEventListener("change", () => {
      index = bySlug(dishSelect.value);
      render();
    });

    prevBtn.addEventListener("click", () => {
      index = (index - 1 + MENU.length) % MENU.length;
      render();
    });

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % MENU.length;
      render();
    });

    fontSelect.addEventListener("change", refreshPreview);

    togglePreviewBtn.addEventListener("click", () => {
      panelBody.classList.toggle("open");
      togglePreviewBtn.textContent = panelBody.classList.contains("open") ? "Ocultar" : "Ver";
    });

    toggleCardBtn.addEventListener("click", () => {
      showCard = !showCard;
      toggleCardBtn.textContent = showCard ? "Ficha ✓" : "Ficha";
      // Por ahora solo togglear estado + preview.
      // La ficha AR real requiere que el GLB tenga un plano/material (ej: InfoCardMat).
      if(!panelBody.classList.contains("open")){
        panelBody.classList.add("open");
        togglePreviewBtn.textContent = "Ocultar";
      }
    });

    // Errores del model viewer
    mv.addEventListener("error", () => {
      setError("No se pudo cargar el modelo 3D. Revisá que el archivo exista en: " + mv.src);
    });

    async function init(){
      const response = await fetch("./menu.json");
      MENU = await response.json();
      render();
      // En mobile abrimos preview cerrado (no molesta)
      panelBody.classList.remove("open");
      togglePreviewBtn.textContent = "Ver";
    }

    // Init
    init();
  </script>
</body>
</html>
