<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VisioAR — Menú 3D + AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Montserrat (opcional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#0b0b0f;
      --bg1:#111118;
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --text:#ffffff;
      --muted:rgba(255,255,255,.68);
      --gold:#f5c16c;
      --radius:16px;
      --shadow: 0 16px 60px rgba(0,0,0,.55);
      --tap: 44px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Montserrat, Arial, Helvetica, sans-serif;
      color:var(--text);
      min-height:100vh;
      background:
        radial-gradient(900px 520px at 50% -10%, #1b2a4d 0%, transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 12px 28px;
    }

    /* Header mobile-first (sticky) */
    .topbar{
      position: sticky;
      top: 10px;
      z-index: 10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(20,20,28,.75);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    /* Logo 1:1 reemplazable */
    .brand__logo{
      width:40px;
      height:40px;
      border-radius: 12px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.55);
      display:grid;
      place-items:center;
      overflow:hidden;
      flex: 0 0 auto;
    }
    .brand__logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .brand__text{
      display:flex;
      flex-direction:column;
      min-width:0;
      line-height:1.1;
    }
    .brand__text b{
      font-size:13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand__text span{
      font-size:11px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Controles compactos */
    .top-controls{
      display:flex;
      gap:8px;
      align-items:center;
    }

    select, button{
      height: var(--tap);
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.45);
      color: var(--text);
      padding: 0 12px;
      font-size: 13px;
      cursor:pointer;
      outline:none;
    }
    button.primary{
      border-color: rgba(245,193,108,.35);
      background: linear-gradient(180deg, rgba(245,193,108,.16), rgba(0,0,0,.35));
    }
    button:active{transform: translateY(1px)}

    /* Hero */
    .hero{
      padding: 14px 2px 8px;
    }
    .hero h1{
      margin: 12px 0 4px;
      font-size: 22px;
      letter-spacing:.2px;
    }
    .price{
      color: var(--gold);
      font-weight: 700;
      font-size: 16px;
      margin: 0 0 8px;
    }
    .sub{
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px;
      max-width: 65ch;
    }

    /* Viewer */
    .viewerShell{
      border-radius: 22px;
      overflow:hidden;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      box-shadow: var(--shadow);
    }
    model-viewer{
      width:100%;
      height: min(56vh, 520px);
      min-height: 360px;
      background: transparent;
      touch-action: pan-y;
    }

    /* AR button (slot) */
    .arBtn{
      background:#000;
      color:#fff;
      border:1px solid rgba(255,255,255,.20);
      padding:12px 18px;
      border-radius: 999px;
      font-size:15px;
    }

    /* Lower actions */
    .actions{
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-top: 12px;
    }
    .actions .left{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .pill{
      height: var(--tap);
      display:inline-flex;
      align-items:center;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.70);
      font-size: 12px;
    }

    /* Debug/Info card preview (colapsable) */
    .panel{
      margin-top: 12px;
      border-radius: var(--radius);
      background: var(--card);
      border:1px solid var(--stroke);
      overflow:hidden;
    }
    .panel__head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .panel__body{
      padding: 12px;
      display:none;
    }
    .panel__body.open{ display:block; }

    .previewImg{
      width:100%;
      max-width: 520px;
      border-radius: 12px;
      border:1px solid var(--stroke);
      display:block;
    }

    /* Error box */
    .errorBox{
      margin-top: 12px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,80,80,.35);
      background: rgba(255,80,80,.08);
      color: rgba(255,255,255,.9);
      display:none;
      font-size: 13px;
      line-height: 1.35;
    }

    /* Desktop enhancements */
    @media (min-width: 860px){
      .wrap{ padding: 18px 16px 40px; }
      .hero h1{ font-size: 28px; }
      .price{ font-size: 18px; }
      model-viewer{ height: 520px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="topbar">
      <div class="brand">
        <div class="brand__logo" title="Logo">
          <img src="assets/logo.png" alt="Logo"
               onerror="this.style.display='none'; this.parentElement.textContent='🍽️';" />
        </div>
        <div class="brand__text">
          <b id="restName">Restaurante Demo</b>
          <span>VisioAR • Menú 3D + AR</span>
        </div>
      </div>

      <div class="top-controls">
        <select id="dishSelect" title="Elegir plato">
          <option value="">Cargando…</option>
        </select>

        <button id="toggleCardBtn" class="primary" title="Ficha del plato">Ficha</button>
      </div>
    </header>

    <section class="hero">
      <h1 id="dishName">Hamburguesa Rica Rica</h1>
      <div class="price" id="dishPrice">$25.900</div>
      <p class="sub" id="dishDesc">
        Colocá el plato en tu mesa/piso con AR. Luego activá la ficha para ver ingredientes y peso.
      </p>
    </section>

    <section class="viewerShell">
      <model-viewer
        id="mv"
        src="models/demo/hamburguesa.glb"
        ar
        ar-modes="scene-viewer webxr quick-look"
        ar-placement="floor"
        ar-scale="fixed"
        scale="1 1 1"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        camera-orbit="0deg 75deg 1.3m"
        field-of-view="30deg"
        alt="Plato en 3D">

        <button slot="ar-button" class="arBtn">👀 Ver en mi espacio</button>
      </model-viewer>
    </section>


    <div class="actions">
      <div class="left">
        <button id="prevBtn">← Anterior</button>
        <button id="nextBtn">Siguiente →</button>
      </div>
      <div class="pill">Tip: en AR, buscá buena luz</div>
    </div>

    <div class="errorBox" id="errorBox"></div>

    <section class="panel">
      <div class="panel__head">
        <div>
          <b style="color:#fff">Ficha generada</b>
          <span style="margin-left:6px">(preview)</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="fontSelect" title="Tipografía ficha">
            <option value="calibri">Calibri</option>
            <option value="montserrat">Montserrat</option>
          </select>
          <button id="togglePreviewBtn" title="Mostrar/ocultar preview">Ver</button>
        </div>
      </div>
      <div class="panel__body" id="panelBody">
        <img id="previewImg" class="previewImg" alt="Preview ficha" />
      </div>
    </section>

  </div>

  <script type="module">
    import { renderItem, updatePreview } from "./src/ui/render.js";
    // -----------------------------
    // Datos mínimos (simple, sin JSON por ahora)
    // -----------------------------
    const MENU = [
      {
        slug: "hamburguesa",
        name: "Hamburguesa Rica Rica",
        price: "$25.900",
        weight: "220 g",
        ingredients: ["Pan brioche tostado","Doble medallón de carne","Cheddar","Lechuga y tomate","Salsa de la casa"],
        glb: "models/demo/hamburguesa.glb"
      },
      {
        slug: "papafritas",
        name: "Papas Fritas",
        price: "$9.900",
        weight: "180 g",
        ingredients: ["Papa","Sal","Aceite","Salsa (opcional)"],
        glb: "models/demo/papafritas.glb"
      },
      {
        slug: "pizzajamon",
        name: "Pizza Jamón",
        price: "$19.900",
        weight: "450 g",
        ingredients: ["Masa","Salsa","Muzza","Jamón"],
        glb: "models/demo/pizzajamon.glb"
      }
    ];

    // UI refs
    const mv = document.getElementById("mv");
    const restName = document.getElementById("restName");
    const dishSelect = document.getElementById("dishSelect");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const fontSelect = document.getElementById("fontSelect");
    const toggleCardBtn = document.getElementById("toggleCardBtn");

    const togglePreviewBtn = document.getElementById("togglePreviewBtn");
    const panelBody = document.getElementById("panelBody");

    const errorBox = document.getElementById("errorBox");

    // Estado
    let index = 0;
    let showCard = false;

    function bySlug(slug){
      const i = MENU.findIndex(x => x.slug === slug);
      return i >= 0 ? i : 0;
    }

    function setError(msg){
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }
    function clearError(){
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    // -----------------------------
    // Ficha (Canvas -> PNG dataURL) — preview (y luego la usás para textura AR si querés)
    // -----------------------------
    function getFontStack(fontKey){
      if(fontKey === "montserrat") return {
        title: "700 34px Montserrat, Arial, sans-serif",
        body:  "500 24px Montserrat, Arial, sans-serif",
        label: "600 26px Montserrat, Arial, sans-serif"
      };
      return {
        title: "700 34px Calibri, Arial, sans-serif",
        body:  "500 24px Calibri, Arial, sans-serif",
        label: "600 26px Calibri, Arial, sans-serif"
      };
    }

    function roundRect(ctx, x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }

    function drawPill(ctx, x, y, text){
      const padX = 18;
      ctx.font = "600 22px Arial, sans-serif";
      const tw = ctx.measureText(text).width;
      const pw = tw + padX*2;
      const ph = 40;

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.strokeStyle = "rgba(245,193,108,0.35)";
      ctx.lineWidth = 3;
      roundRect(ctx, x, y, pw, ph, 18);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(245,193,108,0.95)";
      ctx.fillText(text, x+padX, y+27);
    }

    function generateInfoCardTexture(item, fontKey){
      const w = 1024, h = 512;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      const fonts = getFontStack(fontKey);

      // Fondo “vidrio”
      ctx.fillStyle = "rgba(15,15,20,0.86)";
      ctx.fillRect(0,0,w,h);

      // Borde
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 6;
      roundRect(ctx, 14, 14, w-28, h-28, 26);
      ctx.stroke();

      // Glow suave
      const grad = ctx.createRadialGradient(w*0.82, h*0.18, 20, w*0.82, h*0.18, 420);
      grad.addColorStop(0, "rgba(245,193,108,0.25)");
      grad.addColorStop(1, "rgba(245,193,108,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);

      // Título
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.font = fonts.title;
      ctx.fillText(item.name, 54, 95);

      // Peso
      drawPill(ctx, 54, 120, `Peso: ${item.weight}`);

      // Ingredientes
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.font = fonts.label;
      ctx.fillText("Ingredientes", 54, 195);

      ctx.fillStyle = "rgba(255,255,255,0.70)";
      ctx.font = fonts.body;

      const lines = item.ingredients.map(x => `• ${x}`);
      let y = 235;
      for(const line of lines.slice(0, 6)){
        ctx.fillText(line, 54, y);
        y += 38;
      }

      return c.toDataURL("image/png");
    }

    function refreshPreview(){
      const item = MENU[index];
      const tex = generateInfoCardTexture(item, fontSelect.value);
      updatePreview(tex);
    }

    // -----------------------------
    // Render plato
    // -----------------------------
    function render(){
      const item = MENU[index];
      renderItem(item);

      clearError();

      // Set model (forzamos recarga limpia)
      mv.src = item.glb;

      refreshPreview();
    }

    // -----------------------------
    // Eventos
    // -----------------------------
    dishSelect.addEventListener("change", () => {
      index = bySlug(dishSelect.value);
      render();
    });

    prevBtn.addEventListener("click", () => {
      index = (index - 1 + MENU.length) % MENU.length;
      render();
    });

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % MENU.length;
      render();
    });

    fontSelect.addEventListener("change", refreshPreview);

    togglePreviewBtn.addEventListener("click", () => {
      panelBody.classList.toggle("open");
      togglePreviewBtn.textContent = panelBody.classList.contains("open") ? "Ocultar" : "Ver";
    });

    toggleCardBtn.addEventListener("click", () => {
      showCard = !showCard;
      toggleCardBtn.textContent = showCard ? "Ficha ✓" : "Ficha";
      // Por ahora solo togglear estado + preview.
      // La ficha AR real requiere que el GLB tenga un plano/material (ej: InfoCardMat).
      if(!panelBody.classList.contains("open")){
        panelBody.classList.add("open");
        togglePreviewBtn.textContent = "Ocultar";
      }
    });

    // Errores del model viewer
    mv.addEventListener("error", () => {
      setError("No se pudo cargar el modelo 3D. Revisá que el archivo exista en: " + mv.src);
    });

    // Init
    render();
    // En mobile abrimos preview cerrado (no molesta)
    panelBody.classList.remove("open");
    togglePreviewBtn.textContent = "Ver";
  </script>
</body>
</html>
