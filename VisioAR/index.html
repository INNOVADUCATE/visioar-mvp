<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú 3D Interactivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0f0f12, #1a1a1f);
      color: #ffffff;
      text-align: center;
    }

    .logo {
      margin-top: 20px;
    }

    .logo img {
      width: 150px; /* tamaño correcto */
      height: auto;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 26px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #f5c16c;
      margin-bottom: 10px;
    }

    model-viewer {
      width: 100%;
      height: 420px;
      background: transparent;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 20px 0;
    }

    button {
      background: #000;
      color: #fff;
      border: 1px solid #333;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .note {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 30px;
      padding: 0 20px;
    }
  </style>
</head>
