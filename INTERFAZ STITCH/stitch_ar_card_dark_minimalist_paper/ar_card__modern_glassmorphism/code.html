<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AR Menu Card</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17a1cf",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111d21",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for glass effect */
        .glass-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .glass-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .glass-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black font-display antialiased text-white selection:bg-primary selection:text-white h-screen w-full overflow-hidden relative">
<!-- AR Background Simulation (Camera Feed) -->
<div class="absolute inset-0 z-0 select-none pointer-events-none">
<img class="h-full w-full object-cover opacity-60 scale-105" data-alt="Blurred restaurant table background with warm lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbGMICvrdDbXuscdfwIWqVVJIZdu9MG0ud2oTqk7qyBk4YAQPdzwvKHQGyH2RRsiR8JdCo3kYMcaqWkzAQVynOr0oM84q4jt89ncpC6tlqfrtQ9UgXKzsQFovp7J98Qo9cbgDKBy-AtAoCVsHXrdLV4SSbCfMbiXWfEa_-q97GFsdMU-lNPnWXoczJz0_ICnJKqeX7H4st4Inw1yTB2uosypk-leubogMiPSdGRK4JSkx9_Gyrh8-_YWz497E65EPNmPhVjdGgbqE"/>
<!-- Vignette & Gradients to simulate AR overlay visibility -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80"></div>
</div>
<!-- AR UI Overlay -->
<div class="relative z-10 flex h-full flex-col justify-between p-4 md:p-6 max-w-md mx-auto">
<!-- Top Controls (Simulated App UI) -->
<div class="flex items-center justify-between">
<button class="flex items-center justify-center h-10 w-10 rounded-full bg-background-dark/40 backdrop-blur-md border border-white/10 active:scale-95 transition-transform text-white">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-2 px-4 py-2 rounded-full bg-background-dark/40 backdrop-blur-md border border-white/10">
<div class="h-2 w-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-xs font-semibold tracking-wide uppercase opacity-80">AR Live View</span>
</div>
<button class="flex items-center justify-center h-10 w-10 rounded-full bg-background-dark/40 backdrop-blur-md border border-white/10 active:scale-95 transition-transform text-white">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- AR Reticle (Center Focus) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-30">
<div class="w-16 h-16 border border-white rounded-full flex items-center justify-center">
<div class="w-1 h-1 bg-white rounded-full"></div>
</div>
</div>
<!-- The Modern Glass Card -->
<!-- Using mb-8 to lift it slightly from the absolute bottom -->
<div class="w-full transform transition-all duration-500 hover:scale-[1.02]">
<!-- Card Container -->
<div class="relative overflow-hidden rounded-3xl border border-white/15 bg-[#111d21]/70 backdrop-blur-xl shadow-2xl shadow-black/50">
<!-- 1. Header Section: Solid Dark Gray -->
<div class="bg-[#0f1518] p-6 pb-8 relative border-b border-white/5">
<div class="flex justify-between items-start">
<div class="flex flex-col z-10">
<span class="text-primary text-[10px] font-extrabold tracking-[0.2em] uppercase mb-2">Signature Series</span>
<h2 class="text-3xl font-extrabold leading-[0.95] tracking-tight text-white drop-shadow-sm">
                                SMOKEY<br/>BBQ BEAST
                            </h2>
</div>
<!-- Weight Badge -->
<div class="flex flex-col items-end">
<div class="flex items-center justify-center px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 backdrop-blur-sm">
<span class="material-symbols-outlined text-[16px] mr-1 text-white/60">scale</span>
<span class="text-lg font-bold text-white tracking-tight">250g</span>
</div>
</div>
</div>
<!-- Decorative large background icon for style -->
<span class="material-symbols-outlined absolute -right-4 -bottom-8 text-[120px] text-white/[0.03] rotate-12 pointer-events-none select-none">
                        lunch_dining
                    </span>
</div>
<!-- 2. Ingredients List Section -->
<div class="px-5 pt-6 pb-4 relative z-10 -mt-2">
<div class="flex flex-col gap-2">
<!-- Ingredient 1 -->
<div class="group flex items-center gap-4 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/5 transition-colors cursor-default">
<div class="flex items-center justify-center h-10 w-10 rounded-lg bg-primary/20 text-primary shrink-0 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">bakery_dining</span>
</div>
<div class="flex flex-col">
<span class="text-sm text-white/90 font-semibold">Toasted Brioche Bun</span>
<span class="text-[10px] text-white/50 uppercase tracking-wider">Artisan</span>
</div>
</div>
<!-- Ingredient 2 -->
<div class="group flex items-center gap-4 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/5 transition-colors cursor-default">
<div class="flex items-center justify-center h-10 w-10 rounded-lg bg-primary/20 text-primary shrink-0 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">lunch_dining</span>
</div>
<div class="flex flex-col">
<span class="text-sm text-white/90 font-semibold">100% Angus Beef Patty</span>
<span class="text-[10px] text-white/50 uppercase tracking-wider">Prime Cut</span>
</div>
</div>
<!-- Ingredient 3 -->
<div class="group flex items-center gap-4 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/5 transition-colors cursor-default">
<div class="flex items-center justify-center h-10 w-10 rounded-lg bg-primary/20 text-primary shrink-0 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">layers</span>
</div>
<div class="flex flex-col">
<span class="text-sm text-white/90 font-semibold">Oak Smoked Cheddar</span>
<span class="text-[10px] text-white/50 uppercase tracking-wider">Aged</span>
</div>
</div>
<!-- Ingredient 4 -->
<div class="group flex items-center gap-4 p-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/5 transition-colors cursor-default">
<div class="flex items-center justify-center h-10 w-10 rounded-lg bg-primary/20 text-primary shrink-0 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">water_drop</span>
</div>
<div class="flex flex-col">
<span class="text-sm text-white/90 font-semibold">House BBQ Glaze</span>
<span class="text-[10px] text-white/50 uppercase tracking-wider">Secret Recipe</span>
</div>
</div>
</div>
</div>
<!-- 3. Footer / CTA -->
<div class="p-5 pt-2">
<div class="flex items-center gap-4">
<div class="flex flex-col">
<span class="text-[10px] uppercase text-white/50 tracking-wider">Total Price</span>
<span class="text-2xl font-bold text-white tracking-tight">$14.50</span>
</div>
<button class="flex-1 h-14 bg-primary hover:bg-primary/90 active:bg-primary/80 text-white rounded-xl font-bold text-base shadow-lg shadow-primary/25 flex items-center justify-center gap-2 transition-all">
<span class="material-symbols-outlined">add_shopping_cart</span>
                            Add to Order
                        </button>
</div>
</div>
</div>
<!-- Floating shadow for 3D depth feeling -->
<div class="h-4 w-[90%] mx-auto bg-black/60 blur-xl rounded-[100%] mt-2"></div>
</div>
</div>
</body></html>
