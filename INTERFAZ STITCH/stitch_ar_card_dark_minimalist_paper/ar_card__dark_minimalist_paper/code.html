<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AR Menu Card - Dark Minimalist</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17a1cf",
                        "gold-accent": "#D4AF37", /* Adding a custom gold for the requested premium feel while keeping primary cyan for actions */
                        "background-light": "#f6f7f8",
                        "background-dark": "#111d21",
                        "paper-dark": "#1a1a1a",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    backgroundImage: {
                        'paper-texture': "url('https://www.transparenttextures.com/patterns/stardust.png')", 
                    }
                },
            },
        }
    </script>
<style>/* Custom noise texture overlay to simulate paper */
.bg-noise {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDsbVdUqIktsmR19oHBYNyWMnQcMVmF6cEVSs9ttEKr5FT8DnWfv8IIxy0OOdEecuEYRZhBCbwUleNd_aXshTNmu6sWcPkYQ6IkGLiRh6LAG8XrWskc7wnTvPBjAGDY6qjtKCS8KGpUiC8kCDeLTGk7JLUORYYI1xFN6ADL2SaoYQvX6QYwzg6skAtkTkg08DpmMVWyZxrxyj8WVqigX0RdsgYwSh43BO-8-tUOklhh8rTLcmTGGryo27GetqCb9VSkpcNt3DM9kDo)
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display flex items-center justify-center min-h-screen p-4 sm:p-8">
<!-- AR Card Container -->
<!-- Ideally roughly 9:16 aspect ratio or tall portrait for the AR plane -->
<div class="relative w-full max-w-[360px] overflow-hidden rounded-3xl bg-[#141414] shadow-2xl ring-1 ring-white/10">
<!-- Paper Texture Overlay -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none bg-noise mix-blend-overlay"></div>
<!-- Background Image (Hero) -->
<div class="relative h-64 w-full">
<div class="absolute inset-0 bg-gradient-to-t from-[#141414] via-[#141414]/60 to-transparent z-10"></div>
<img alt="The Grand Truffle Burger" class="h-full w-full object-cover object-center" data-alt="Gourmet double patty burger with melting cheese and truffle sauce on a dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4RZrnDuvtL7GBZZESJo10hVcHND5L-RzIEve8a0wTqq8TL-SFve5sTZZhatAzzm1z36-tIL--KOsGWQs2SQso4LtCdwUngP0lL6tBprm_Vf--Ufh696str0odG-R_fvHXBzmP5ZQ3hwrNimax1aReKlbT287nh_KK1tUUaTBELxj3A9cyaoZVhMj0sgWUvSJ9pAbyB41yS5Nqlnbxfze5aYfD52RBNYG5izVVZN7gljLq8z0eaqPUIOOYAm-mAPIYF9JkdIenF_M"/>
<!-- Floating Weight Badge -->
<div class="absolute top-4 right-4 z-20">
<div class="flex items-center gap-1 rounded-full bg-black/40 px-3 py-1 backdrop-blur-md ring-1 ring-white/20">
<span class="material-symbols-outlined text-primary text-[16px]">scale</span>
<span class="text-xs font-bold text-white tracking-wider">220g</span>
</div>
</div>
</div>
<!-- Content Section -->
<div class="relative z-20 -mt-10 flex flex-col px-6 pb-8">
<!-- Header -->
<div class="text-center">
<h1 class="font-display text-3xl font-extrabold uppercase leading-tight tracking-tight text-white drop-shadow-lg">
                    The Grand <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">Truffle</span> Burger
                </h1>
<div class="mt-2 flex items-center justify-center gap-2">
<div class="h-[1px] w-8 bg-gold-accent/50"></div>
<p class="text-xs font-medium uppercase tracking-[0.2em] text-gold-accent">Signature Selection</p>
<div class="h-[1px] w-8 bg-gold-accent/50"></div>
</div>
</div>
<!-- Spacer -->
<div class="h-8"></div>
<!-- Ingredients List -->
<div class="space-y-4">
<div class="group flex items-center justify-between border-b border-white/5 pb-3 transition-colors hover:border-primary/30">
<div class="flex items-center gap-3">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-white/5 text-primary">
<span class="material-symbols-outlined text-[18px]">bakery_dining</span>
</span>
<div>
<p class="text-sm font-semibold text-gray-200">Bun</p>
<p class="text-xs text-gray-500">Toasted Brioche</p>
</div>
</div>
<span class="material-symbols-outlined text-gray-600 opacity-0 transition-opacity group-hover:opacity-100">check</span>
</div>
<div class="group flex items-center justify-between border-b border-white/5 pb-3 transition-colors hover:border-primary/30">
<div class="flex items-center gap-3">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-white/5 text-primary">
<span class="material-symbols-outlined text-[18px]">lunch_dining</span>
</span>
<div>
<p class="text-sm font-semibold text-gray-200">Patty</p>
<p class="text-xs text-gray-500">Premium Wagyu Beef</p>
</div>
</div>
</div>
<div class="group flex items-center justify-between border-b border-white/5 pb-3 transition-colors hover:border-primary/30">
<div class="flex items-center gap-3">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-white/5 text-primary">
<span class="material-symbols-outlined text-[18px]">water_drop</span>
</span>
<div>
<p class="text-sm font-semibold text-gray-200">Sauce</p>
<p class="text-xs text-gray-500">Truffle Aioli</p>
</div>
</div>
</div>
<div class="group flex items-center justify-between border-b border-white/5 pb-3 transition-colors hover:border-primary/30">
<div class="flex items-center gap-3">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-white/5 text-primary">
<span class="material-symbols-outlined text-[18px]">token</span>
</span>
<div>
<p class="text-sm font-semibold text-gray-200">Cheese</p>
<p class="text-xs text-gray-500">Aged Cheddar</p>
</div>
</div>
</div>
</div>
<!-- Spacer -->
<div class="h-8"></div>
<!-- Footer / Price -->
            <div class="mt-auto flex items-center justify-between gap-4 pt-4">
                <div class="flex flex-col">
                    <span class="text-xs font-medium text-gray-400">Total Price</span>
                    <span class="text-2xl font-bold text-white">$24.00</span>
                </div>
                <div class="flex items-center gap-2 rounded-full bg-white/5 px-3 py-2">
                    <span class="material-symbols-outlined animate-pulse text-[14px] text-gray-400">view_in_ar</span>
                    <span class="text-[10px] font-medium uppercase tracking-widest text-gray-400">AR Preview</span>
                </div>
            </div>
</div>
</div>
</body></html>
